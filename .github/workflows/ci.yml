name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest-py312:
    name: pytest-py312
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Compile Python
        run: python -m compileall -q src tests scripts

      - name: Validate shell scripts
        run: sh -n scripts/deploy.sh scripts/provision_vps.sh scripts/register_runner.sh scripts/phase9_acceptance.sh

      - name: Repository-wide tests
        run: python -m pytest -q

  pytest-py314:
    name: pytest-py314
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Repository-wide tests
        run: python -m pytest -q

  docker-amd64:
    name: docker-amd64
    needs: pytest-py312
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Compose
        env:
          KTRADER_DOMAIN: example.invalid
          KTRADER_IMAGE_TAG: ci-amd64
        run: docker compose config >/dev/null

      - name: Build amd64 image
        run: docker build --pull --platform linux/amd64 --tag k-trader:${{ github.sha }}-amd64 .

      - name: Import runtime application from amd64 image
        run: >-
          docker run --rm --platform linux/amd64
          -e KTRADER_DB_PATH=/tmp/ktrader-ci.db
          k-trader:${{ github.sha }}-amd64
          python -c "from ktrader.runtime.app import app; assert app.title == 'K-Trader Read-only API'"

      - name: Verify VPS acceptance utility is packaged
        run: docker run --rm --platform linux/amd64 k-trader:${{ github.sha }}-amd64 python scripts/vps_acceptance.py --help >/dev/null

  docker-arm64:
    name: docker-arm64
    needs: pytest-py312
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and load arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          pull: true
          tags: k-trader:${{ github.sha }}-arm64

      - name: Verify arm64 architecture
        run: test "$(docker image inspect k-trader:${{ github.sha }}-arm64 --format '{{.Architecture}}')" = "arm64"

      - name: Import runtime application from arm64 image
        run: >-
          docker run --rm --platform linux/arm64
          -e KTRADER_DB_PATH=/tmp/ktrader-ci.db
          k-trader:${{ github.sha }}-arm64
          python -c "import platform; from ktrader.runtime.app import app; assert platform.machine() in ('aarch64','arm64'); assert app.title == 'K-Trader Read-only API'"

      - name: Verify VPS acceptance utility is packaged
        run: docker run --rm --platform linux/arm64 k-trader:${{ github.sha }}-arm64 python scripts/vps_acceptance.py --help >/dev/null

  canonical-merge-gate:
    name: canonical-merge-gate
    if: always()
    needs:
      - pytest-py312
      - pytest-py314
      - docker-amd64
      - docker-arm64
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every canonical CI job to succeed
        run: |
          test "${{ needs.pytest-py312.result }}" = "success"
          test "${{ needs.pytest-py314.result }}" = "success"
          test "${{ needs.docker-amd64.result }}" = "success"
          test "${{ needs.docker-arm64.result }}" = "success"
