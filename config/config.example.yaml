project:
  name: K-Trader
  mode: read_only
  timezone_display: Europe/Kyiv
  timezone_storage: UTC

providers:
  mode: primary_with_fallback
  priority:
    - binance_usdm
    - bybit_linear
    - okx_swap
    - kucoin_futures
  require_public_market_data: true
  allow_cross_provider_series_mix: false

universe:
  quote_asset: USDT
  perpetual_only: true
  price_limit:
    enabled: true
    max_price: 3.0
  max_candidates: 50

history:
  bars:
    1d: 250
    4h: 250
    1h: 250
    15m: 250
    5m: 300

freshness:
  fail_on_stale_data: true
  max_age_intervals: 2.0

validation:
  require_utc_boundaries: true
  require_contiguous_closed_history: true
  fail_on_missing_bars: true
  atomic_mtf_bootstrap: true

live:
  preferred_base_interval: 5m
  local_aggregation: true
  aggregate_intervals:
    - 15m
    - 1h
    - 4h
    - 1d
  rest_reconciliation: true
  reconcile_every_closed_bars: 12
  reconcile_lookback: 3
  stale_after_seconds: 90
  reconnect_initial_seconds: 1
  reconnect_max_seconds: 30
  persist_open_candles: false
  fail_on_stale_data: true

indicators:
  atr:
    period: 14
    smoothing: wilder
  atr5d:
    valid_days: 5
    abnormal_high_multiplier: 2.0
    abnormal_low_multiplier: 0.3333333333333333
    reference_mode: same_bar_atr14
  moving_average:
    method: sma
    fast_period: 50
    slow_period: 200
  volume:
    baseline_window: 20
    exclude_current_from_baseline: true
  atr_used:
    origin: utc_day_directional_extreme_to_entry
    source_interval: 5m
    require_utc_day_start: true

market_structure:
  pivots:
    left: 2
    right: 2
    strict: true
  regime:
    htf_order:
      - 1d
      - 4h
      - 1h
    require_structure_ma_alignment_for_direction: true
  strength:
    participation_min_relative_volume: 1.0
  sessions:
    presentation_timezone: Europe/Kyiv
    windows:
      - name: TOKYO
        timezone: Asia/Tokyo
        start_local: "09:00"
        end_local: "18:00"
      - name: LONDON
        timezone: Europe/London
        start_local: "08:00"
        end_local: "17:00"
      - name: NEW_YORK
        timezone: America/New_York
        start_local: "08:00"
        end_local: "17:00"
  levels:
    intervals:
      - 1d
      - 4h
      - 1h
      - 15m
    zone_atr_fraction: 0.15
    confirm_touches: 2
    strong_touches: 3
    break_buffer: 0.0
    automatic_types:
      - HISTORICAL
      - CONSOLIDATION
    explicit_only_types:
      - LIMIT
      - PARANORMAL_BAR
  consolidation:
    window: 12
    max_width_atr: 2.0

trap:
  min_break_atr_fraction: 0.05
  max_return_bars: 3
  max_confirmation_bars: 2
  eligible_level_statuses:
    - CONFIRMED
    - MIRROR

vsa:
  baseline_window: 20
  narrow_spread_max: 0.8
  wide_spread_min: 1.5
  low_volume_max: 0.8
  high_volume_min: 1.8
  stopping_volume_min: 1.5
  context:
    max_level_distance_atr_fraction: 0.25
    confirmation_bars: 2
    require_htf_direction: true
    require_confirmed_level: true

trading_engine:
  setup_types:
    - TRAP_VSA_CONFIRMATION
    - VSA_LEVEL_CONFIRMATION
    - TRAP_LEVEL_CONFIRMATION
  require_strong_primary_level: true
  geometry:
    luft_atr_fraction: 0.02
    min_luft_ticks: 1
    target_mode: nearest_confirmed_opposing_level
    allow_synthetic_rr_target: false
  scoring:
    weights:
      market_regime: 20
      liquidity: 10
      session: 5
      trap: 15
      mtf_level: 15
      strength: 10
      vsa: 15
      atr: 5
      rr: 5
    grades:
      a_plus_min: 90
      a_min: 80
      b_min: 70
      c_max: 69
    hard_reject_score_cap: 69
    score_is_probability: false

risk_rules:
  min_rr: 3.0
  atr_used_strong_max_pct: 40
  atr_used_acceptable_max_pct: 80

rating:
  tradable_grades:
    - A+
    - A
  score_is_probability: false

storage:
  backend: sqlite
  path: data/ktrader.db
  wal: true
  busy_timeout_ms: 5000

api:
  read_only: true
  https_required: true
  auth_mode: none_initial
  rate_limit_required: true
  rate_limit_requests: 120
  rate_limit_window_seconds: 60
  trust_x_forwarded_for: false
  decimal_json_mode: string
