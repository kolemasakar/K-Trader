name: Temporary Phase11G Audit Symbol Fix

on:
  push:
    branches:
      - phase11g/prospective-control-hardening

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase11g/prospective-control-hardening
          fetch-depth: 0
      - name: Apply exact audit-symbol patch
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/ktrader/replay/prospective.py')
          text = source.read_text(encoding='utf-8')
          replacements = [
              (
                  'class ProspectiveDecisionAudit:\n    decision_id: str\n    signal_key: str | None\n',
                  'class ProspectiveDecisionAudit:\n    decision_id: str\n    canonical_symbol: str\n    signal_key: str | None\n',
              ),
              (
                  '    return ProspectiveDecisionAudit(\n        decision_id=decision_fingerprint(decision),\n        signal_key=signal_key,\n',
                  '    return ProspectiveDecisionAudit(\n        decision_id=decision_fingerprint(decision),\n        canonical_symbol=decision.canonical_symbol,\n        signal_key=signal_key,\n',
              ),
              (
                  '    return {\n        "decision_id": decision.decision_id,\n        "signal_key": decision.signal_key,\n',
                  '    return {\n        "decision_id": decision.decision_id,\n        "canonical_symbol": decision.canonical_symbol,\n        "signal_key": decision.signal_key,\n',
              ),
              (
                  '    return ProspectiveDecisionAudit(\n        decision_id=str(payload.get("decision_id")),\n        signal_key=str(payload["signal_key"]) if payload.get("signal_key") is not None else None,\n',
                  '    return ProspectiveDecisionAudit(\n        decision_id=str(payload.get("decision_id")),\n        canonical_symbol=str(payload.get("canonical_symbol")),\n        signal_key=str(payload["signal_key"]) if payload.get("signal_key") is not None else None,\n',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one source match, got {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)
          source.write_text(text, encoding='utf-8')

          test = Path('tests/test_phase11g_prospective_signal_fixture.py')
          text = test.read_text(encoding='utf-8')
          old = '        decision_id="decision-1",\n        signal_key="signal-1",\n'
          new = '        decision_id="decision-1",\n        canonical_symbol="SUIUSDT",\n        signal_key="signal-1",\n'
          if text.count(old) != 1:
              raise SystemExit('synthetic fixture constructor match failed')
          text = text.replace(old, new, 1)
          old = '    assert record["signal_key"] == "signal-1"\n'
          new = '    assert record["canonical_symbol"] == "SUIUSDT"\n    assert record["signal_key"] == "signal-1"\n'
          if text.count(old) != 1:
              raise SystemExit('synthetic fixture assertion match failed')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-phase11g-audit-symbol-fix.yml
          git add src/ktrader/replay/prospective.py tests/test_phase11g_prospective_signal_fixture.py
          git commit -m "Phase 11G: include symbol in prospective audit records"
          git push origin HEAD:phase11g/prospective-control-hardening
