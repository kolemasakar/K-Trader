name: k-trader

services:
  ktrader:
    image: k-trader:${KTRADER_IMAGE_TAG:-local}
    build:
      context: .
      args:
        KTRADER_RUNTIME_UID: ${KTRADER_RUNTIME_UID:-1000}
        KTRADER_RUNTIME_GID: ${KTRADER_RUNTIME_GID:-1000}
    restart: unless-stopped
    init: true
    environment:
      KTRADER_DB_PATH: /data/ktrader.db
      KTRADER_PROVIDERS: ${KTRADER_PROVIDERS:-binance_usdm,bybit_linear}
      KTRADER_QUOTE_ASSET: ${KTRADER_QUOTE_ASSET:-USDT}
      KTRADER_PRICE_LIMIT_ENABLED: ${KTRADER_PRICE_LIMIT_ENABLED:-true}
      KTRADER_MAX_PRICE: ${KTRADER_MAX_PRICE:-3}
      KTRADER_MAX_CANDIDATES: ${KTRADER_MAX_CANDIDATES:-50}
      KTRADER_ANALYSIS_LIMIT: ${KTRADER_ANALYSIS_LIMIT:-20}
      KTRADER_SCAN_INTERVAL_SECONDS: ${KTRADER_SCAN_INTERVAL_SECONDS:-60}
      KTRADER_BOOTSTRAP_CONCURRENCY: ${KTRADER_BOOTSTRAP_CONCURRENCY:-2}
      KTRADER_ACTION_API_KEY: ${KTRADER_ACTION_API_KEY:-}
      KTRADER_RESEARCH_CAPTURE_ENABLED: ${KTRADER_RESEARCH_CAPTURE_ENABLED:-true}
      KTRADER_RESEARCH_CAPTURE_INTERVAL_SECONDS: ${KTRADER_RESEARCH_CAPTURE_INTERVAL_SECONDS:-300}
      KTRADER_RESEARCH_ROOT: /data/research/universe
      KTRADER_BACKUP_ENABLED: ${KTRADER_BACKUP_ENABLED:-true}
      KTRADER_BACKUP_INTERVAL_SECONDS: ${KTRADER_BACKUP_INTERVAL_SECONDS:-21600}
      KTRADER_BACKUP_ROOT: /data/backups
      KTRADER_BACKUP_RETENTION: ${KTRADER_BACKUP_RETENTION:-7}
      KTRADER_DISK_MIN_FREE_BYTES: ${KTRADER_DISK_MIN_FREE_BYTES:-2147483648}
      KTRADER_DISK_MIN_FREE_PERCENT: ${KTRADER_DISK_MIN_FREE_PERCENT:-5}
      KTRADER_HEALTH_MAX_SCAN_AGE_SECONDS: ${KTRADER_HEALTH_MAX_SCAN_AGE_SECONDS:-180}
    volumes:
      - ${KTRADER_ROOT:-/opt/k-trader}/data:/data
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; p=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)); raise SystemExit(0 if p.get('data_ready') and p.get('watchdog_ok') and p.get('scanner_status') in {'READY','DEGRADED'} else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      ktrader:
        condition: service_healthy
    environment:
      KTRADER_DOMAIN: ${KTRADER_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${KTRADER_ROOT:-/opt/k-trader}/caddy_data:/data
      - ${KTRADER_ROOT:-/opt/k-trader}/caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
