name: Temporary Approved Deploy 81b79b28

on:
  push:
    branches:
      - ops/deploy-81b79b28

permissions:
  contents: read

concurrency:
  group: k-trader-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, k-trader-prod-arm64]
    environment: production
    timeout-minutes: 30
    env:
      KTRADER_DOMAIN: ${{ vars.KTRADER_DOMAIN }}
      KTRADER_ACTION_API_KEY: ${{ secrets.KTRADER_ACTION_API_KEY }}
    steps:
      - name: Checkout exact approved merge SHA
        uses: actions/checkout@v6
        with:
          ref: 81b79b281a4cc330b7c11058d202e0d74fb6d70e
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact approved SHA
        run: test "$(git rev-parse HEAD)" = "81b79b281a4cc330b7c11058d202e0d74fb6d70e"

      - name: Verify Oracle production architecture
        run: test "$(uname -m)" = "aarch64" -o "$(uname -m)" = "arm64"

      - name: Deploy and run canonical live acceptance
        run: ./scripts/deploy.sh
