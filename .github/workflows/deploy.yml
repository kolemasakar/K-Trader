name: Deploy Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k-trader-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, k-trader-prod]
    environment: production
    timeout-minutes: 30
    env:
      KTRADER_DOMAIN: ${{ vars.KTRADER_DOMAIN }}
    steps:
      - name: Checkout approved main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Deploy and run live acceptance
        run: ./scripts/deploy.sh
