name: Research Guards

on:
  push:
    branches: [research-strategy-benchmark-v1]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: research-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase11g-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Compile research utilities
        run: python -m compileall -q scripts tests
      - name: Run Phase 11G guard tests
        run: >-
          python -m pytest -q
          tests/test_phase11g_guardrails.py
          tests/test_phase11g_pause_runner.py
          tests/test_phase11g_data_quality_watchdog.py
          tests/test_plugin_surface_guard.py
      - name: Enforce actual Plugin OpenAPI read-only surface
        run: python scripts/plugin_surface_guard.py custom_gpt/openapi.yaml
