name: K_AI MT4 Production Acceptance

on:
  push:
    branches: [main]
    paths:
      - ".github/ops/kai-mt4-public-e2e-20260917"

permissions:
  contents: read

jobs:
  usdtry-public-e2e:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      KTRADER_ACTION_API_KEY: ${{ secrets.KTRADER_ACTION_API_KEY }}
    steps:
      - name: Verify authenticated public USDTRY MT4 Action
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          url = "https://ktrader-api.duckdns.org/v1/mt4/market-context/USDTRY?market=forex"
          key = os.environ.get("KTRADER_ACTION_API_KEY", "")
          if not key:
              raise SystemExit("FAIL missing KTRADER_ACTION_API_KEY")

          try:
              urllib.request.urlopen(url, timeout=15)
          except urllib.error.HTTPError as exc:
              if exc.code != 401:
                  raise SystemExit(f"FAIL unauthenticated request returned {exc.code}") from exc
          else:
              raise SystemExit("FAIL unauthenticated request was not rejected")

          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {key}",
                  "Accept": "application/json",
                  "User-Agent": "K-Trader-production-mt4-acceptance",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              status = response.status
              payload = json.loads(response.read().decode("utf-8"))

          if status != 200:
              raise SystemExit(f"FAIL authenticated request returned {status}")
          if payload.get("provider_id") != "kai_mt4":
              raise SystemExit("FAIL provider_id")
          if payload.get("source_name") != "MT4":
              raise SystemExit("FAIL source_name")
          if payload.get("symbol") != "USDTRY" or payload.get("market") != "forex":
              raise SystemExit("FAIL symbol/market")
          if payload.get("schema_version") != "1.1":
              raise SystemExit("FAIL schema_version")
          if payload.get("closed_bars_only") is not True:
              raise SystemExit("FAIL closed_bars_only")
          if payload.get("time_source") != "BrokerServer":
              raise SystemExit("FAIL time_source")
          if payload.get("timestamp_semantics") != "BROKER_SERVER_WALL_CLOCK_OPAQUE":
              raise SystemExit("FAIL timestamp_semantics")
          if payload.get("utc_offset_minutes") is not None:
              raise SystemExit("FAIL utc_offset_minutes")

          scopes = payload.get("scopes") or {}
          expected_depths = {"D1": 60, "H1": 200, "M15": 300, "M5": 300}
          if set(scopes) != set(expected_depths):
              raise SystemExit("FAIL scopes")
          for timeframe, depth in expected_depths.items():
              scope = scopes[timeframe]
              if scope.get("bar_depth") != depth:
                  raise SystemExit(f"FAIL {timeframe} bar_depth")
              if len(scope.get("bars") or []) != depth:
                  raise SystemExit(f"FAIL {timeframe} bars")
              if not scope.get("latest_closed_bar_time") or not scope.get("current_bar_time"):
                  raise SystemExit(f"FAIL {timeframe} timestamps")

          print(json.dumps({
              "status": "PASS",
              "http_status": status,
              "provider_id": payload.get("provider_id"),
              "source_name": payload.get("source_name"),
              "symbol": payload.get("symbol"),
              "market": payload.get("market"),
              "schema_version": payload.get("schema_version"),
              "run_id": payload.get("run_id"),
              "closed_bars_only": payload.get("closed_bars_only"),
              "time_source": payload.get("time_source"),
              "timestamp_semantics": payload.get("timestamp_semantics"),
              "utc_offset_minutes": payload.get("utc_offset_minutes"),
              "bar_depths": {name: scopes[name].get("bar_depth") for name in sorted(scopes)},
              "credential_logged": False,
          }, sort_keys=True))
          PY
