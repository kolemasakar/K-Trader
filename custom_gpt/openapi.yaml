openapi: 3.1.0
info:
  title: K-Trader Read-only API
  version: phase10-production-v1
  description: >-
    Read-only market scanner API for K_Trader. It exposes confirmed public
    market data, canonical Trading Engine results, and validated read-only MT4
    market context. It cannot place, modify, or cancel orders and exposes no
    exchange-account endpoints.
servers:
  - url: https://ktrader-api.duckdns.org
    description: Accepted Phase 10 production HTTPS origin.
security:
  - BearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check K-Trader API and scanner readiness
      security: []
      responses:
        '200':
          description: API/scanner health state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/scanner/status:
    get:
      operationId: getScannerStatus
      summary: Get scanner runtime status and data readiness
      responses:
        '200':
          description: Scanner runtime state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScannerStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/universe:
    get:
      operationId: listUniverse
      summary: List the current ranked tradable universe
      parameters:
        - name: provider_id
          in: query
          required: false
          description: >-
            Provider identifier such as binance_usdm or bybit_linear. Required when
            the same canonical symbol is available from more than one provider.
          schema: {type: string}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: Ranked universe with market metadata and freshness
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UniverseList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v1/market/{symbol}:
    get:
      operationId: getMarketSnapshot
      summary: Get the latest normalized market snapshot for a scanner symbol
      parameters:
        - name: symbol
          in: path
          required: true
          description: Canonical K-Trader scanner symbol, for example SUIUSDT.
          schema: {type: string}
        - name: provider_id
          in: query
          required: false
          schema: {type: string}
      responses:
        '200':
          description: Latest scanner market snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UniverseCandidate'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Ambiguous'}
  /v1/mt4/market-context/{symbol}:
    get:
      operationId: getMT4MarketContext
      summary: Acquire fresh validated read-only MT4 market context for a symbol
      description: >-
        Uses the bounded K_AI/MT4 market-context bridge. This route is independent
        of the Binance scanner universe and does not activate trading or register
        MT4 as the production scanner provider. Broker-server timestamps are opaque
        wall-clock strings and must not be interpreted as UTC.
      parameters:
        - name: symbol
          in: path
          required: true
          description: MT4 broker symbol or accepted canonical alias, for example USDTRY.
          schema: {type: string}
        - name: market
          in: query
          required: false
          description: K_AI market classification passed to the MT4 context bridge.
          schema: {type: string, default: forex}
      responses:
        '200':
          description: Fresh schema 1.1 MT4 market context accepted by K-Trader
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MT4MarketContext'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {description: Invalid symbol or market request}
        '503': {description: MT4 market-context route disabled, misconfigured, busy, or temporarily unavailable}
  /v1/candles/{symbol}:
    get:
      operationId: getCandles
      summary: Get confirmed normalized scanner candles for a symbol and timeframe
      parameters:
        - name: symbol
          in: path
          required: true
          schema: {type: string}
        - name: provider_id
          in: query
          required: false
          schema: {type: string}
        - name: interval
          in: query
          required: false
          schema: {type: string, enum: [5m, 15m, 1h, 4h, 1d], default: 5m}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      responses:
        '200':
          description: Confirmed candle series including provider/aggregate provenance
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CandleSeries'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Ambiguous'}
  /v1/analysis/{symbol}:
    get:
      operationId: getAnalysis
      summary: Get the best current Trading Engine decision for a scanner symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema: {type: string}
        - name: provider_id
          in: query
          required: false
          schema: {type: string}
      responses:
        '200':
          description: Canonical TradingDecision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TradingDecision'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Ambiguous'}
  /v1/candidates:
    get:
      operationId: listCandidates
      summary: List ranked current setup candidates, including NO_TRADE results
      parameters:
        - name: provider_id
          in: query
          required: false
          schema: {type: string}
        - name: grade
          in: query
          required: false
          schema: {type: string, enum: [A+, A, B, C]}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: Ranked candidate decisions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DecisionList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /v1/signals:
    get:
      operationId: listSignals
      summary: List only currently tradable A or A+ LONG/SHORT signals
      parameters:
        - name: provider_id
          in: query
          required: false
          schema: {type: string}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: Current tradable signals only
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DecisionList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Configure the Action with the same API key stored as KTRADER_ACTION_API_KEY on the server.
  responses:
    Unauthorized: {description: Missing or invalid Bearer API key}
    NotFound: {description: Requested scanner symbol or analysis is not available}
    Ambiguous: {description: Symbol exists on multiple scanner providers; repeat with provider_id}
  schemas:
    Health:
      type: object
      required: [status, mode, api_version, data_ready, scanner_status, action_auth_enabled, generated_at]
      properties:
        status: {type: string, enum: [ok, degraded]}
        mode: {type: string, enum: [read_only]}
        api_version: {type: string}
        data_ready: {type: boolean}
        scanner_status: {type: string}
        provider_id: {type: [string, 'null']}
        action_auth_enabled: {type: boolean}
        generated_at: {type: string, format: date-time}
    ScannerStatus:
      type: object
      required: [status, universe_size, data_ready, cycle_id, symbols_ready, symbols_failed, live_streaming, started_at]
      properties:
        status: {type: string}
        provider_id: {type: [string, 'null']}
        universe_size: {type: integer}
        data_ready: {type: boolean}
        last_scan_at: {type: [string, 'null'], format: date-time}
        last_error: {type: [string, 'null']}
        cycle_id: {type: integer}
        symbols_ready: {type: integer}
        symbols_failed: {type: integer}
        live_streaming: {type: boolean}
        last_cycle_duration_seconds: {type: [number, 'null']}
        started_at: {type: string, format: date-time}
    UniverseList:
      type: object
      required: [count, items]
      properties:
        count: {type: integer}
        provider_id: {type: [string, 'null']}
        items: {type: array, items: {$ref: '#/components/schemas/UniverseCandidate'}}
    UniverseCandidate:
      type: object
      properties:
        provider_id: {type: string}
        canonical_symbol: {type: string}
        provider_symbol: {type: string}
        market_type: {type: string}
        contract_type: {type: string}
        status: {type: string}
        base_asset: {type: string}
        quote_asset: {type: string}
        price_tick: {type: [string, 'null']}
        quantity_step: {type: [string, 'null']}
        last_price: {type: string}
        quote_volume_24h: {type: [string, 'null']}
        base_volume_24h: {type: [string, 'null']}
        trade_count_24h: {type: [integer, 'null']}
        bid_price: {type: [string, 'null']}
        ask_price: {type: [string, 'null']}
        spread_bps: {type: [string, 'null']}
        open_interest: {type: [string, 'null']}
        liquidity_score: {type: string}
        data_time: {type: string, format: date-time}
        data_age_seconds: {type: number}
    CandleSeries:
      type: object
      properties:
        provider_id: {type: string}
        canonical_symbol: {type: string}
        interval: {type: string}
        source_kind: {type: string}
        count: {type: integer}
        candles: {type: array, items: {$ref: '#/components/schemas/Candle'}}
    Candle:
      type: object
      properties:
        provider_id: {type: string}
        canonical_symbol: {type: string}
        interval: {type: string}
        open_time: {type: string}
        close_time: {type: string}
        open: {type: string}
        high: {type: string}
        low: {type: string}
        close: {type: string}
        volume: {type: string}
        closed: {type: boolean}
    MT4MarketContext:
      type: object
      required: [provider_id, source_name, symbol, market, schema_version, run_id, closed_bars_only, bid, ask, spread, digits, point, scopes]
      properties:
        provider_id: {type: string, enum: [kai_mt4]}
        source_name: {type: string, enum: [MT4]}
        symbol: {type: string}
        market: {type: string}
        schema_version: {type: string, enum: ['1.1']}
        run_id: {type: string}
        as_of: {type: [string, 'null'], description: Opaque BrokerServer wall-clock timestamp; not UTC.}
        last_tick_time: {type: [string, 'null'], description: Opaque BrokerServer wall-clock timestamp; not UTC.}
        time_source: {type: string, enum: [BrokerServer]}
        timestamp_semantics: {type: string, enum: [BROKER_SERVER_WALL_CLOCK_OPAQUE]}
        utc_offset_minutes: {type: 'null'}
        closed_bars_only: {type: boolean, enum: [true]}
        bid: {type: number}
        ask: {type: number}
        spread: {type: number}
        digits: {type: integer}
        point: {type: number}
        tick_value: {type: number}
        tick_size: {type: number}
        contract_size: {type: number}
        min_lot: {type: number}
        max_lot: {type: number}
        lot_step: {type: number}
        stop_level: {type: number}
        freeze_level: {type: number}
        trade_allowed: {type: boolean}
        terminal_connected: {type: boolean}
        market_open: {type: boolean}
        swap_long: {type: number}
        swap_short: {type: number}
        scopes:
          type: object
          required: [D1, H1, M15, M5]
          properties:
            D1: {$ref: '#/components/schemas/MT4Scope'}
            H1: {$ref: '#/components/schemas/MT4Scope'}
            M15: {$ref: '#/components/schemas/MT4Scope'}
            M5: {$ref: '#/components/schemas/MT4Scope'}
          additionalProperties: false
    MT4Scope:
      type: object
      required: [timeframe, snapshot_id, bar_depth, latest_closed_bar_time, current_bar_time, bars]
      properties:
        timeframe: {type: string, enum: [D1, H1, M15, M5]}
        snapshot_id: {type: string}
        bar_depth: {type: integer}
        latest_closed_bar_time: {type: string, description: Opaque BrokerServer wall-clock timestamp; not UTC.}
        current_bar_time: {type: string, description: Opaque BrokerServer wall-clock timestamp; not UTC.}
        bars:
          type: array
          items: {$ref: '#/components/schemas/MT4Bar'}
    MT4Bar:
      type: object
      required: [time, open, high, low, close, volume]
      properties:
        time: {type: string, description: Opaque BrokerServer wall-clock timestamp; not UTC.}
        open: {type: number}
        high: {type: number}
        low: {type: number}
        close: {type: number}
        volume: {type: number}
    DecisionList:
      type: object
      properties:
        count: {type: integer}
        items: {type: array, items: {$ref: '#/components/schemas/TradingDecision'}}
    TradingDecision:
      type: object
      properties:
        provider_id: {type: string}
        exchange: {type: string}
        canonical_symbol: {type: string}
        provider_symbol: {type: string}
        market_type: {type: string}
        side: {type: string, enum: [LONG, SHORT, NO_TRADE]}
        grade: {type: string, enum: [A+, A, B, C]}
        setup_score: {type: integer}
        raw_score: {type: integer}
        setup_type: {type: string}
        market_regime: {type: string}
        trend_context: {type: string}
        liquidity_rank: {type: integer}
        liquidity_score: {type: [string, 'null']}
        sessions: {type: array, items: {type: string}}
        session_overlap: {type: boolean}
        strength: {type: string}
        primary_level_id: {type: [string, 'null']}
        primary_level_strength: {type: [string, 'null']}
        trap_state: {type: [string, 'null']}
        vsa_events: {type: array, items: {type: string}}
        entry: {type: [string, 'null']}
        luft: {type: [string, 'null']}
        stop: {type: [string, 'null']}
        target: {type: [string, 'null']}
        rr: {type: [string, 'null']}
        atr5d: {type: [string, 'null']}
        atr_used_pct: {type: [string, 'null']}
        atr_state: {type: [string, 'null']}
        position_size: {type: [string, 'null']}
        risk_amount: {type: [string, 'null']}
        risk_percent: {type: [string, 'null']}
        reason_codes: {type: array, items: {type: string}}
        data_time: {type: string}
        last_closed_bar: {type: string}
        data_age_seconds: {type: number}
        freshness_status: {type: string, enum: [FRESH, STALE]}
        generated_at: {type: string}
        engine_version: {type: string}
        estimated_probability: {type: [number, 'null']}
