name: Research Safety CI

on:
  push:
    branches: [research-strategy-benchmark-v1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase11g-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install pytest

      - name: Compile research safety utilities
        run: >-
          python -m py_compile
          scripts/phase11g_guardrails.py
          scripts/phase11g_data_quality_watchdog.py
          scripts/phase11g_path_quality.py
          scripts/phase11g_causal_runner.py
          scripts/phase11g_pause_preflight.py
          scripts/phase11g_hypothesis_proposals.py
          scripts/phase11g_replay_consistency.py
          scripts/plugin_surface_guard.py

      - name: Run Phase 11G guardrail tests
        run: >-
          python -m pytest -q
          tests/test_phase11g_guardrails.py
          tests/test_phase11g_causal_runner.py
          tests/test_phase11g_pause_preflight.py
          tests/test_phase11g_replay_consistency.py
          tests/test_plugin_surface_guard.py

      - name: Compile isolated retrospective auditor
        run: python -m py_compile research/strategy_benchmark_v1/audit_retrospective_gap_v1.py

      - name: Test isolated retrospective auditor
        run: python -m pytest -q research/strategy_benchmark_v1/tests/test_audit_retrospective_gap_v1.py

      - name: Compile isolated forward-only epoch recorder
        run: python -m py_compile research/strategy_benchmark_v1/prospective_epoch_capture_v1.py

      - name: Test isolated forward-only epoch recorder
        run: python -m pytest -q research/strategy_benchmark_v1/tests/test_prospective_epoch_capture_v1.py

      - name: Assert frozen production boundary in OpenAPI
        run: python scripts/plugin_surface_guard.py custom_gpt/openapi.yaml
